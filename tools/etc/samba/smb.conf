# smbclient's settings: Samba's client reads /etc/samba/smb.conf (the guest runs no Samba server).
# Every client option is in smb.conf(5); one command can also take them as
# --option='NAME=VALUE', and -m / --max-protocol sets the highest dialect to offer.
[global]
	# SMB1 (NT1) is offered as well as SMB2 and SMB3, so that old servers (NAS boxes,
	# printers, Windows XP and Server 2003, Samba 3) can be reached: the newest dialect both
	# sides speak is the one used. Samba's own default is SMB2_02, which refuses SMB1:
	#	client min protocol = SMB2_02
	client min protocol = NT1

	# A server that only knows LANMAN or NTLMv1 logins (Windows 9x, NT 4 before SP4) also
	# needs these, which send weaker password hashes (Samba calls the two auth options
	# deprecated, and still honours them):
	#	client min protocol = CORE
	#	client ntlmv2 auth = no
	#	client lanman auth = yes

	# Signing and encryption: SMB3 servers ask for what they want; to insist from this side
	# (or --client-protection=sign|encrypt for one command):
	#	client signing = required
	#	client smb encrypt = required
