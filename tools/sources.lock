# Sources of the tools image (tools.cpio): name, URL, sha256 of the download.
# Versions follow third_party/distro/distro/*/package.nix; each tarball unpacks to exactly the tree
# whose Nix NAR hash distro pins there (checked with python/nar-hash.py when a line changes).
# distro has no screen: its line is GNU's release tarball, as published. openssl is the release
# python/sources.lock pins for the guest's libssl/libcrypto, so the command and the library agree;
# sqlite likewise the one Python's _sqlite3 is built from. distro has no Subversion either: svn and
# what it needs (apr, apr-util, serf, expat) are the release tarballs as published (Apache's from
# its archive, whose sha256 files match these; expat's from its GitHub release).
