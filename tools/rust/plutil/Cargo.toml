[package]
name = "collabo-plutil"
version = "6.4.2"
description = "plutil, written again in Rust for the guest: Apple's plutil and CoreFoundation's property lists as swift-corelibs-foundation 6.4.2 has them"
edition.workspace = true
# Follows Apple's code (Apache-2.0, LICENSE-swift-corelibs-foundation).
