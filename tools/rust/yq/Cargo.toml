[package]
name = "collabo-yq"
version = "4.54.1"
description = "yq, the YAML/JSON/XML/... processor, written again in Rust for the guest"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A library: the `yq` applet of collabo-data (../data).
[lib]
path = "src/lib.rs"

[dependencies]
regex = "1"
libc = "0.2"
unicode-normalization = "0.1"
