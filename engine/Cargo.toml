[package]
name = "collabo-core-engine"
version = "0.2.10"
edition = "2021"
description = "collaboCore sandbox engine: runs the WebAssembly Linux kernel with wasmtime"
license = "MIT"

[dependencies]
wasmtime = { version = "37", default-features = false, features = ["cranelift", "runtime", "threads", "parallel-compilation", "std", "gc", "gc-null"] }
wasmparser = "0.239"
# dylink.rs: a library's imports bound to its own definitions (the version wasmtime uses)
wasm-encoder = { version = "0.239", features = ["wasmparser"] }
anyhow = "1"
rand = "0.9"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
serde_json = "1.0.151"
# launcher --addons get: the release's zips are deflated (the zip reader is the launcher's own).
flate2 = "1"
crc32fast = "1"
# SHA-256 for ssh key fingerprints (already in the tree through rustls).
ring = "0.17"
# The secret-injecting TLS proxy for the packet network (intercept.rs): the same rustls and roots
# ureq uses, and rcgen for the session CA and its per-host certificates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = "0.3"

# The host side of the guest's ping (icmp.rs): an ICMP datagram socket, or IcmpSendEcho; the host
# terminal in raw mode (main.rs): termios, or the console modes; the serial ports lent to the guest
# (serial.rs): termios and modem ioctls, or the COM port functions and the registry's list.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_System_Console", "Win32_Devices_Communication", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_IO"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
