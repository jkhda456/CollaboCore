# The Rust the engine is built and tested with. rustup installs it on first use (CI, Windows);
# scripts/package-runtime-windows.ps1 installs it for the x64 host itself. Dependencies need at
# least 1.88 (wasmtime 37, rcgen), and Cargo.lock is version 4 (Cargo >= 1.78).
[toolchain]
channel = "1.98.1"
profile = "minimal"
