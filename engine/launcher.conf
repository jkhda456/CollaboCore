# launcher.conf: what ./launcher starts (launcher.exe on Windows).
#
# The launcher runs bin/collabo-core-engine with the arguments manifest.json's `entry` gives (the
# kernel, the images, the add-on folder), then the options below, then its own arguments.
# `launcher --dry-run` prints the command line it would run; `launcher --help` lists the keys.
#
# One `key = value` per line; # starts a comment. A key is an engine option without its dashes
# (bin/collabo-core-engine --help); the repeatable ones may appear more than once. ~ is the home
# folder and ${NAME} an environment variable. Relative host paths are relative to this folder.

# --- Machine ---
# mount: HOST:GUEST[:ro], a host folder shared at a guest path (repeatable; :ro = read-only).
mount = work:/work
# mount = ~/projects:/projects:ro

# cpus: how many virtual CPUs the guest gets (default 2).
# cpus = 2
# python: off leaves out the CPython overlay (smaller, faster boot).
# python = off
# tools: off leaves out curl, ssh and git.
# tools = off

# --- Network --- (any host by default; this computer's own services only when allowed)
# allow: a host the guest may reach, one per line (repeatable). The first allow replaces "any";
#        "example.com" is that host only, "*.example.com" its subdomains only, "*" any host.
# allow = api.anthropic.com
# deny: a host it may never reach, one per line (repeatable; checked before allow).
# deny = example.com
# no-network: yes refuses every outbound connection.
# no-network = yes
# allow-loopback: yes lets the guest reach localhost and 127.x (the allow list still applies).
# allow-loopback = yes
# log-network: the network log, every request the guest makes as a [network] line, appended to
#              this file with its UTC time (- is stderr). None by default.
# log-network = logs/network.log
# secret: HOST:HEADER=VALUE, a header added to https requests to HOST; the guest never sees it.
# secret = api.example.com:authorization=Bearer ${EXAMPLE_API_KEY}

# --- GUI programs --- (the `gui` command; needs the tools image)
# gui-config: KEY=VALUE, a setting of the display (repeatable): the size limits, and whether
# agents may take screenshots, send input and use the clipboard.
# gui-config = maxSize=1280x800
# gui-config = clipboard=false

# --- Add-ons --- (app/images/addons)
# addon: boot with that add-on, e.g. Claude Code in the guest (repeatable).
# addon = claude-code
# addon-config: NAME:KEY=VALUE, one add-on setting (repeatable; implies addon = NAME).
# addon-config = claude-code:provider=openai
# addon-config = claude-code:baseUrl=http://localhost:11434/v1
# addon-config = claude-code:model=qwen3-coder
# addon-config = claude-code:apiKey=${ANTHROPIC_API_KEY}

# --- Command ---
# command: run this one command instead of the shell (as `exec -- ...`).
# command = python3 -c 'print("hello")'
# cwd: the guest folder that command runs in.
# cwd = /work

# log-exec: the exec log, a history of what ran, appended to this file with its UTC time (- is
#           stderr). None by default. [run] lines: the command above, when it starts and how it
#           ended; [exec] lines: every program the guest starts, from any shell or script, with its
#           pid, uid, folder and arguments, or why it failed.
# log-exec = logs/exec.log
# log-exec-kinds: which of those lines to keep: run, exec or run,exec (the default).
# log-exec-kinds = exec

# --- Log files --- (a line longer than 4 KiB is cut, saying how much)
# log-file: the network log and the exec log together in this one file (log-network or log-exec
#           still send theirs elsewhere).
# log-file = logs/collabo.log
# log-max-size: a log file grows to at most this size (K, M, G); no limit when not set.
# log-max-size = 10M
# log-rotate: at that size, move FILE to FILE.1 (FILE.1 to FILE.2, ...) and keep this many old
#             files. 0 (the default) keeps the file as it is and drops later lines.
# log-rotate = 3

# --- Terminal ---
# no-raw: yes keeps this terminal line-buffered (Ctrl-C then ends the engine, not a guest program).
# no-raw = yes
