# launcher.conf: what ./launcher starts (launcher.exe on Windows).
#
# The launcher runs bin/collabo-core-engine with the arguments manifest.json's `entry` gives (the
# kernel, the images, the add-on folder), then the options below, then its own arguments.
# `launcher --dry-run` prints the command line it would run; `launcher --help` lists the keys.
# `launcher --config FILE` reads another file like this one instead of this one.
# `launcher --addons list` / `launcher --addons get NAME` list and download add-ons;
# `launcher --addons enable|disable NAME` turns one on or off in this file.
# `launcher --version` prints the version; `launcher --update` downloads a newer release and
# `launcher --update --apply` puts it in place of this runtime (this file stays as it is).
#
# One `key = value` per line; # starts a comment. A key is an engine option without its dashes
# (bin/collabo-core-engine --help); the repeatable ones may appear more than once. ~ is the home
# folder and ${NAME} an environment variable. Relative host paths are relative to this file's
# folder.

# --- Runtime --- (where its parts are; beside the launcher by default)
# bin: the folder collabo-core-engine is in.
# bin = /opt/collabo-core/bin
# app: the folder holding images/ (the kernel, the images, images/addons) instead of app/.
# app = /opt/collabo-core/app

# --- Machine ---
# mount: HOST:GUEST[:ro], a host folder shared at a guest path (repeatable; :ro = read-only).
mount = work:/work
# mount = ~/projects:/projects:ro

# cpus: how many virtual CPUs the guest gets (default 2).
# cpus = 2
# no-preempt: yes stops interrupting programs on a tick: interpreters (Python, shells) run up to
#             ~15% faster, but a loop without syscalls then keeps its CPU and cannot be killed.
# no-preempt = yes
# python: off leaves out the CPython overlay (smaller, faster boot).
# python = off
# tools: off leaves out curl, ssh and git.
# tools = off

# --- Network --- (any host by default; this computer's own services only when allowed)
# allow: a host the guest may reach, one per line (repeatable). The first allow replaces "any";
#        "example.com" is that host only, "*.example.com" its subdomains only, "*" any host;
#        an IP, a CIDR block (192.168.1.0/24, fd00::/8) or IPv4 with * for its last octets
#        (192.168.1.*, 10.*; not IPv6) is those addresses (a name still needs one of the others).
# allow = api.anthropic.com
# allow = 192.168.1.0/24
# deny: a host it may never reach, one per line (repeatable; checked before allow). An address
#       rule is refused by whatever name resolves into it too. A rule written wrong (bits past
#       the prefix, 10.*.0.1, fd00::*, a * inside a name) stops the engine from starting.
# deny = example.com
# deny = 10.0.0.0/8
# no-network: yes refuses every outbound connection.
# no-network = yes
# allow-loopback: yes lets the guest reach localhost and 127.x (the allow list still applies).
# allow-loopback = yes
# private-networks: the private networks' addresses (10/8, 172.16/12, 192.168/16, 100.64/10,
#                   169.254/16, fc00::/7, fe80::/10), by whatever name the guest reaches them:
#                   allow (the default), deny (the internet only) or only (the local networks
#                   only). A host an `allow` line names exactly (no *) is exempt from it, and
#                   so is an address an `allow` address rule holds.
# private-networks = deny
# log-network: the network log, every request the guest makes as a [network] line, appended to
#              this file with its UTC time (- is stderr). None by default.
# log-network = logs/network.log
# secret: HOST:HEADER=VALUE, a header added to https requests to HOST; the guest never sees it.
# secret = api.example.com:authorization=Bearer ${EXAMPLE_API_KEY}
# skip-tls-verify: yes checks no https certificate at all, on any request the host makes for the
#                  guest (self-signed local servers; for development only, the keys of `secret`
#                  still go). Programs with their own TLS in the guest (curl, git) still check.
# skip-tls-verify = yes
# allow-header: a request header the guest may set itself on the request API (repeatable, or
#               NAME,NAME), beyond accept, content-type, authorization and x-api-key: e.g. the
#               header an MCP server of the agent in the guest takes its key in.
# allow-header = x-auth-token

# --- Serial ports --- (the c-sh add-on's serial: targets; none are shared by default)
# serial: a serial device of this computer the guest may open (repeatable): a path or glob
#         (/dev/ttyUSB0, /dev/ttyACM*, COM3), usb:VID:PID[:SERIAL] in hex (that adapter wherever
#         it is plugged in), or * for every serial port this computer lists (a terminal or a
#         pty only by name). Only terminal devices are ever opened.
# serial = /dev/ttyUSB*
# serial = usb:0403:6001

# --- GUI programs --- (the `gui` command; needs the tools image)
# gui-config: KEY=VALUE, a setting of the display (repeatable): the size limits, and whether
# agents may take screenshots, send input and use the clipboard.
# gui-config = maxSize=1280x800
# gui-config = clipboard=false

# --- Add-ons --- (app/images/addons)
# `launcher --addons list` lists the add-ons of the add-on repository (marking those you have,
# and naming those only you have); `launcher --addons get NAME...` downloads them, always the
# latest, into the add-on folder. `launcher --addons enable NAME...` turns them on here: it
# uncomments `# addon = NAME`, or adds `addon = NAME` at the end of this block; `launcher --addons
# disable NAME...` comments their addon lines out again, and their addon-config lines too (which
# turn an add-on on as well), marked `# (--addons disable)` so that enable turns them back on.
# With --config FILE, it is that file they edit.
# addons-repo: that repository's GitHub release, an API URL or OWNER/REPO (its latest release).
#              Default: https://api.github.com/repos/jkhda456/CollaboAddons/releases/latest
# addons-repo = me/my-addons
# addon: boot with that add-on, e.g. agent, collaboCore's coding agent in the guest (repeatable).
# addon = agent
# addon-config: NAME:KEY=VALUE, one add-on setting (repeatable; implies addon = NAME).
# addon-config = agent:provider=openai
# addon-config = agent:baseUrl=http://localhost:11434/v1
# addon-config = agent:model=qwen3-coder
# addon-config = agent:apiKey=${ANTHROPIC_API_KEY}
# Remote control of the agent's session from a Telegram chat: the bot's token (kept on this
# computer, as apiKey is) and who may use it, Telegram user ids or @usernames.
# addon-config = agent:telegramBotToken=${TELEGRAM_BOT_TOKEN}
# addon-config = agent:telegramAllowedUsers=12345678, @alice

# --- Updates ---
# `launcher --update` downloads this platform's archive of the latest collaboCore release into
# the current folder when it is newer than this runtime (--check only says; --force downloads it
# all the same). `launcher --update --apply` puts it in place: the archive --update downloaded
# (here or in the runtime folder), else the release's, downloaded then (or `--apply FILE`); it is
# unpacked and checked first (CRCs, every file against its manifest's sha256; --force only warns
# about a sum), the old files are moved into .update/ (Windows cannot overwrite a program that
# runs) and removed after, and if the new launcher does not start with this file (`launcher
# --dry-run`) everything is put back. This file is never replaced (the release's is not even
# unpacked); work/ and the add-ons you added stay.
# update-repo: the GitHub release --update uses, an API URL or OWNER/REPO (its latest release).
#              Default: https://api.github.com/repos/jkhda456/CollaboCore/releases/latest
# update-repo = me/my-collabo-core

# --- Command ---
# command: run this one command instead of the shell (as `exec -- ...`).
# command = python3 -c 'print("hello")'
# cwd: the guest folder that command runs in.
# cwd = /work

# log-exec: the exec log, a history of what ran, appended to this file with its UTC time (- is
#           stderr). None by default. [run] lines: the command above, when it starts and how it
#           ended; [exec] lines: every program the guest starts, from any shell or script, with its
#           pid, uid, folder and arguments, or why it failed.
# log-exec = logs/exec.log
# log-exec-kinds: which of those lines to keep: run, exec or run,exec (the default).
# log-exec-kinds = exec

# --- Log files --- (a line longer than 4 KiB is cut, saying how much)
# log-file: the network log and the exec log together in this one file (log-network or log-exec
#           still send theirs elsewhere).
# log-file = logs/collabo.log
# log-max-size: a log file grows to at most this size (K, M, G); no limit when not set.
# log-max-size = 10M
# log-rotate: at that size, move FILE to FILE.1 (FILE.1 to FILE.2, ...) and keep this many old
#             files. 0 (the default) keeps the file as it is and drops later lines.
# log-rotate = 3

# --- Terminal ---
# no-raw: yes keeps this terminal line-buffered (Ctrl-C then ends the engine, not a guest program).
# no-raw = yes
