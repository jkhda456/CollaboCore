# Cross-platform verification of collaboCore.
#
#   build   (ubuntu)  kernel, guest userspace, Python, the Linux engine and its tests
#   runtime (matrix)  builds the engine on each platform and runs the end-to-end test there
#   dart    (matrix)  the Dart package tests against that platform's runtime
#   flutter (matrix)  a Flutter desktop app that depends on the package builds on each OS
#
# The kernel and guest images are built once on Linux and shared as an artifact; the engine is
# native code, so each platform builds its own (cargo) and packages the runtime there.
name: collaboCore

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Sources that are not vendored (kernel, distro)
        run: |
          [ -d kernel/linux ] || git clone --depth 1 -b wasm https://github.com/tombl/linux.git kernel/linux
          [ -d third_party/distro ] || git clone --depth 1 https://github.com/tombl/distro.git third_party/distro
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y make flex bison bc pkg-config libncurses-dev device-tree-compiler \
            wabt clang-19 lld-19 llvm-19 rsync python3 openssl
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            userspace/src
            python/src
            nettools/src
          key: tools-${{ hashFiles('scripts/bootstrap-tools.sh', 'userspace/build.sh', 'python/build*.sh', 'python/*.lock', 'nettools/sources.lock') }}
      - name: Build
        run: python3 build.py
      - name: Linux tests (unit, guest boots, runtime)
        run: python3 build.py test --boot && .tools/node/bin/node --test --test-concurrency=1 --test-timeout=240000 tests/runtime.e2e.mjs
      - name: Test kit (this platform)
        run: PLATFORMS=linux-x64 python3 build.py testkit dist/testkit
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: dist/engine
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: testkit
          path: dist/testkit
          retention-days: 7

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-13, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: images, path: dist/engine }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the engine and package the runtime for this platform
        shell: bash
        run: bash scripts/package-runtime.sh
      - name: End-to-end test
        shell: bash
        run: |
          COLLABO_CORE_RUNTIME="$PWD/dist/runtime" \
            node --test --test-concurrency=1 --test-timeout=240000 tests/runtime.e2e.mjs

  dart:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: images, path: dist/engine }
      - uses: dtolnay/rust-toolchain@stable
      - uses: dart-lang/setup-dart@v1
      - name: Build the engine and package the runtime for this platform
        shell: bash
        run: bash scripts/package-runtime.sh
      - name: Dart package tests against this platform's runtime
        working-directory: dart/collabo_core
        shell: bash
        run: |
          dart pub get
          dart analyze
          COLLABO_CORE_RUNTIME="$GITHUB_WORKSPACE/dist/runtime" dart test --concurrency=1 --timeout=5m

  flutter:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux }
          - { os: macos-14, target: macos }
          - { os: windows-2022, target: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: images, path: dist/engine }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine and package the runtime for this platform
        shell: bash
        run: bash scripts/package-runtime.sh
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Build the demo app and run its sandbox test inside the Flutter engine
        working-directory: flutter/collabo_core_demo
        shell: bash
        run: |
          flutter config --enable-${{ matrix.target }}-desktop
          flutter pub get
          flutter analyze
          COLLABO_CORE_RUNTIME="$GITHUB_WORKSPACE/dist/runtime" flutter test
          flutter build ${{ matrix.target }} --release
